name: Windows companion EXE
on:
  push:
    branches: ['feature/v2.3-control-centre']
    paths: ['windows_app/**', '.github/workflows/windows-companion-exe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Prepare existing v2.2 backend
        shell: pwsh
        run: |
          Copy-Item RotaryDeck_v2.2/companion/rotary_deck_sync.py windows_app/rotary_deck_sync.py
          python -m pip install -r RotaryDeck_v2.2/companion/requirements.txt "pyinstaller>=6,<7"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check imports and build single EXE
        shell: pwsh
        working-directory: windows_app
        run: |
          python launcher.py --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name RotaryDeckCompanion --hidden-import rotary_deck_sync --collect-all winrt --collect-all pycaw --collect-all comtypes launcher.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $process = Start-Process -FilePath .\dist\RotaryDeckCompanion.exe -ArgumentList '--self-test' -PassThru
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'EXE smoke test timed out' }
          if ($process.ExitCode -ne 0) { throw 'EXE import smoke test failed' }
          python -m pip freeze | Set-Content dist/build-dependencies.txt
          '${{ github.sha }}' | Set-Content dist/source-commit.txt
          Get-FileHash dist/RotaryDeckCompanion.exe -Algorithm SHA256 | Format-List | Out-File dist/SHA256.txt
          Copy-Item ../LICENSE dist/LICENSE.txt
          Copy-Item ../RotaryDeck_v2.2/THIRD_PARTY_NOTICES.md dist/THIRD_PARTY_NOTICES.md
      - uses: actions/upload-artifact@v4
        with:
          name: RotaryDeckCompanion-Windows-x64-preview
          path: windows_app/dist/
          if-no-files-found: error
          retention-days: 7
